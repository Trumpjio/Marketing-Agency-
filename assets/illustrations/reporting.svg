<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Measurement and reporting</title>
  <desc id="desc">A conceptual report combines a trend line, channel summaries and a list of decisions.</desc>
  <rect width="640" height="300" rx="24" fill="#f5f8fd"/>
  <rect x="24" y="24" width="592" height="252" rx="18" fill="#ffffff" stroke="#dce5f2"/>
  <text x="54" y="60" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Review and adjust</text>
  <rect x="52" y="82" width="318" height="158" rx="12" fill="#f8faff" stroke="#e0e7f0"/>
  <g stroke="#e0e7f0" stroke-width="1">
    <path d="M78 112H345M78 145H345M78 178H345M78 211H345"/>
  </g>
  <path d="M84 198 L125 181 L165 189 L205 147 L245 158 L286 121 L337 103" fill="none" stroke="#3269d2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#3269d2" stroke-width="3">
    <circle cx="125" cy="181" r="4"/><circle cx="205" cy="147" r="4"/><circle cx="286" cy="121" r="4"/><circle cx="337" cy="103" r="4"/>
  </g>
  <rect x="388" y="82" width="190" height="70" rx="12" fill="#eefbf4" stroke="#b9e6ce"/>
  <text x="406" y="108" fill="#145b3a" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">What changed?</text>
  <text x="406" y="130" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="11">Compare with the baseline</text>
  <rect x="388" y="166" width="190" height="74" rx="12" fill="#e6f2ff" stroke="#bfd9fb"/>
  <text x="406" y="192" fill="#234f93" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">What comes next?</text>
  <text x="406" y="213" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="11">Decide, document, repeat</text>
  <text x="54" y="265" fill="#626977" font-family="Inter,Arial,sans-serif" font-size="10">Conceptual reporting view · not performance data</text>
</svg>