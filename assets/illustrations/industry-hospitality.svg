  <text x="56" y="78" fill="#5b6472" font-family="Inter,Arial,sans-serif" font-size="12">Support discovery, confidence and direct booking.</text>
  <g>
    <rect x="54" y="103" width="282" height="116" rx="15" fill="#ffffff" stroke="#dce5f2"/>
    <circle cx="82" cy="131" r="15" fill="#4da45a"/><text x="82" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800">01</text>
    <text x="107" y="135" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750">Discovery</text>
    <text x="78" y="165" fill="#5b6472" font-family="Inter,Arial,sans-serif" font-size="12">Inspire the right guest at the right time</text>
    <path d="M78 186H298" stroke="#e0e7f0" stroke-width="5" stroke-linecap="round"/><path d="M78 186H210" stroke="#4da45a" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  </g>
  <g>
    <rect x="409" y="103" width="282" height="116" rx="15" fill="#ffffff" stroke="#dce5f2"/>
    <circle cx="437" cy="131" r="15" fill="#4da45a"/><text x="437" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800">02</text>
    <text x="462" y="135" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750">Confidence</text>
    <text x="433" y="165" fill="#5b6472" font-family="Inter,Arial,sans-serif" font-size="12">Show useful details and reduce uncertainty</text>
    <path d="M433 186H653" stroke="#e0e7f0" stroke-width="5" stroke-linecap="round"/><path d="M433 186H596" stroke="#4da45a" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  </g>
  <g>
    <rect x="764" y="103" width="282" height="116" rx="15" fill="#ffffff" stroke="#dce5f2"/>
    <circle cx="792" cy="131" r="15" fill="#4da45a"/><text x="792" y="135" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800">03</text>
    <text x="817" y="135" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750">Booking</text>
    <text x="788" y="165" fill="#5b6472" font-family="Inter,Arial,sans-serif" font-size="12">Make the direct path clear and simple</text>
    <path d="M788 186H1008" stroke="#e0e7f0" stroke-width="5" stroke-linecap="round"/><path d="M788 186H929" stroke="#4da45a" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  </g>
  <g fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M336 160H398l-7-6m7 6-7 6"/><path d="M691 160H753l-7-6m7 6-7 6"/></g>
