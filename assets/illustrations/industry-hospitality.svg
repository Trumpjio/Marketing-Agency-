<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">Hospitality guest journey</title>
  <desc id="desc">Support discovery, confidence and direct booking. Discovery, Confidence, Booking form a conceptual workflow. No client performance figures are shown.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8faff"/><stop offset="100%" stop-color="#eaf1fd"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4da45a" stop-opacity=".35"/><stop offset="100%" stop-color="#4da45a" stop-opacity=".8"/></linearGradient>
  </defs>
  <rect width="1100" height="350" rx="24" fill="url(#surface)"/>
  <g stroke="#dfe7f4" stroke-width="1"><path d="M0 70H1100M0 140H1100M0 210H1100M0 280H1100"/><path d="M80 0V350M160 0V350M240 0V350M320 0V350M400 0V350M480 0V350M560 0V350M640 0V350M720 0V350M800 0V350M880 0V350M960 0V350M1040 0V350"/></g>
  <rect x="24" y="20" width="1052" height="310" rx="20" fill="#ffffff" stroke="#d8e3f3"/>
