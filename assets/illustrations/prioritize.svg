<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Priority mapping</title>
  <desc id="desc">A simple priority map separates high-impact work from work that can wait.</desc>
  <rect width="640" height="300" rx="24" fill="#f5f8fd"/>
  <rect x="24" y="24" width="592" height="252" rx="18" fill="#ffffff" stroke="#dce5f2"/>
  <text x="54" y="60" fill="#202453" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Priority map</text>
  <rect x="76" y="86" width="226" height="74" rx="12" fill="#eefbf4" stroke="#b9e6ce"/>
  <rect x="318" y="86" width="226" height="74" rx="12" fill="#e6f2ff" stroke="#bfd9fb"/>
  <rect x="76" y="174" width="226" height="74" rx="12" fill="#f7f8fa" stroke="#dfe3e9"/>
  <rect x="318" y="174" width="226" height="74" rx="12" fill="#fff8e2" stroke="#f0dfad"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="96" y="116" font-size="13" font-weight="700" fill="#145b3a">Do first</text>
    <text x="96" y="138" font-size="11" fill="#3c4048">High impact · clear path</text>
    <text x="338" y="116" font-size="13" font-weight="700" fill="#234f93">Plan next</text>
    <text x="338" y="138" font-size="11" fill="#3c4048">High impact · more effort</text>
    <text x="96" y="204" font-size="13" font-weight="700" fill="#626977">Maintain</text>
    <text x="96" y="226" font-size="11" fill="#626977">Low risk · steady upkeep</text>
    <text x="338" y="204" font-size="13" font-weight="700" fill="#8a4a20">Defer or drop</text>
    <text x="338" y="226" font-size="11" fill="#626977">Low impact · avoid distraction</text>
  </g>
  <text x="54" y="265" fill="#626977" font-family="Inter,Arial,sans-serif" font-size="10">Illustrative framework · priorities vary by engagement</text>
</svg>