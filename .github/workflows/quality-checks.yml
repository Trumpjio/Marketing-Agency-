name: OrcaPulse Hostinger release validation

on:
  pull_request:
    branches: [deploy]
  push:
    branches:
      - deploy
      - fix/orcapulse-source-audit-remediation
      - fix/orcapulse-hostinger-release
      - fix/orcapulse-post-merge-hardening
      - fix/orcapulse-comprehensive-site-polish
      - fix/orcapulse-professional-layout

permissions:
  contents: read

jobs:
  syntax-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      - name: Validate site links, sitemap, settings, and structured data
        run: python3 scripts/validate_orcapulse_site.py

      - name: Validate UI, accessibility-related behavior, copy, and lead flow
        run: |
          python3 -m py_compile scripts/validate_orcapulse_site.py scripts/validate_orcapulse_ux.py scripts/normalize_site_copy.py
          python3 scripts/validate_orcapulse_ux.py

      - name: Validate sitemap XML and enforce canonical host
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          if not urls:
              raise SystemExit("Sitemap contains no URL entries")
          if len(urls) != len(set(urls)):
              duplicates = [url for url, count in collections.Counter(urls).items() if count > 1]
              raise SystemExit("Duplicate sitemap URLs: " + ", ".join(duplicates))
          hosts = collections.Counter(urllib.parse.urlparse(url).netloc.lower() for url in urls)
          print(f"Validated {len(urls)} unique sitemap URLs; hosts: {dict(hosts)}")
          if set(hosts) != {"orcapulse.io"}:
              raise SystemExit(f"Sitemap hosts must be exactly {{'orcapulse.io'}}, found: {dict(hosts)}")
          if any(urllib.parse.urlparse(url).scheme != "https" for url in urls):
              raise SystemExit("All sitemap URLs must use HTTPS")
          PY

      - name: Guard against known security regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("admin/config.php").read_text()
          forgot = Path("admin/forgot.php").read_text()
          robots = Path("robots.txt").read_text()
          failures = []
          if "orcapulse2026" in config:
              failures.append("Committed default admin password remains in config")
          if "$_SERVER['HTTP_HOST']" in forgot or '$_SERVER["HTTP_HOST"]' in forgot:
              failures.append("Password reset URL still trusts HTTP_HOST")
          if "Sitemap: https://orcapulse.io/sitemap.xml" not in robots:
              failures.append("robots.txt must advertise the verified production sitemap https://orcapulse.io/sitemap.xml")
          if "ioka.online" in robots.lower() or "orcapulse.com" in robots.lower():
              failures.append("robots.txt still references a legacy host")
          if failures:
              raise SystemExit("\\n".join(failures))
          print("Security regression guards passed")
          PY

  browser-responsive:
    needs: syntax-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start the local PHP website
        shell: bash
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/orcapulse-php-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              echo "Local site ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orcapulse-php-server.log
          exit 1

      - name: Test all HTML pages at five viewport widths
        run: node scripts/smoke_site_responsive.cjs

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcapulse-design-audit-screenshots
          path: artifacts/design-audit/
          if-no-files-found: warn
          retention-days: 7

