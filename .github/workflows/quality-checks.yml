name: OrcaPulse Hostinger release validation

on:
  pull_request:
    branches: [deploy]
  push:
    branches:
      - deploy
      - fix/orcapulse-source-audit-remediation
      - fix/orcapulse-hostinger-release
      - fix/orcapulse-post-merge-hardening
      - fix/orcapulse-comprehensive-site-polish
      - fix/orcapulse-professional-layout

permissions:
  contents: read

jobs:
  syntax-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      - name: Validate site links, sitemap, settings, and structured data
        run: python3 scripts/validate_orcapulse_site.py

      - name: Validate UI, accessibility-related behavior, copy, and lead flow
        run: |
          python3 -m py_compile scripts/validate_orcapulse_site.py scripts/validate_orcapulse_ux.py scripts/validate_conversion_paths.py scripts/normalize_site_copy.py
          python3 scripts/validate_orcapulse_ux.py
          python3 scripts/validate_conversion_paths.py

      - name: Validate sitemap XML and enforce canonical host
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          if not urls:
              raise SystemExit("Sitemap contains no URL entries")
          if len(urls) != len(set(urls)):
              duplicates = [url for url, count in collections.Counter(urls).items() if count > 1]
              raise SystemExit("Duplicate sitemap URLs: " + ", ".join(duplicates))
          hosts = collections.Counter(urllib.parse.urlparse(url).netloc.lower() for url in urls)
          print(f"Validated {len(urls)} unique sitemap URLs; hosts: {dict(hosts)}")
          if set(hosts) != {"orcapulse.io"}:
              raise SystemExit(f"Sitemap hosts must be exactly {{'orcapulse.io'}}, found: {dict(hosts)}")
          if any(urllib.parse.urlparse(url).scheme != "https" for url in urls):
              raise SystemExit("All sitemap URLs must use HTTPS")
          PY

      - name: Guard against known security regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("admin/config.php").read_text()
          forgot = Path("admin/forgot.php").read_text()
          robots = Path("robots.txt").read_text()
          failures = []
          if "orcapulse2026" in config:
              failures.append("Committed default admin password remains in config")
          if "$_SERVER['HTTP_HOST']" in forgot or '$_SERVER["HTTP_HOST"]' in forgot:
              failures.append("Password reset URL still trusts HTTP_HOST")
          if "Sitemap: https://orcapulse.io/sitemap.xml" not in robots:
              failures.append("robots.txt must advertise the verified production sitemap https://orcapulse.io/sitemap.xml")
          if "ioka.online" in robots.lower() or "orcapulse.com" in robots.lower():
              failures.append("robots.txt still references a legacy host")
          if failures:
              raise SystemExit("\\n".join(failures))
          print("Security regression guards passed")
          PY

  lighthouse-mobile:
    needs: syntax-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage branch
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save lighthouse playwright
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Prepare deploy baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin deploy --depth=1
          git worktree add --detach /tmp/orcapulse-baseline FETCH_HEAD
          php -S 127.0.0.1:8001 -t /tmp/orcapulse-baseline > /tmp/orcapulse-baseline.log 2>&1 &
          php -S 127.0.0.1:8000 -t . > /tmp/orcapulse-current.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/index.html >/dev/null && curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              echo "Baseline and PR sites are ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orcapulse-baseline.log /tmp/orcapulse-current.log
          exit 1

      - name: Run Lighthouse mobile baseline and PR audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:8001/index.html --form-factor=mobile --only-categories=performance,accessibility,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=artifacts/lighthouse/before.json --quiet
          npx lighthouse http://127.0.0.1:8000/index.html --form-factor=mobile --only-categories=performance,accessibility,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=artifacts/lighthouse/after.json --quiet
          node - <<'NODE'
          const fs = require('node:fs');
          const beforeReport = JSON.parse(fs.readFileSync('artifacts/lighthouse/before.json', 'utf8'));
          const afterReport = JSON.parse(fs.readFileSync('artifacts/lighthouse/after.json', 'utf8'));
          const before = beforeReport.lighthouseResult || beforeReport;
          const after = afterReport.lighthouseResult || afterReport;
          const categories = ['performance', 'accessibility', 'seo'];
          const results = { categories: {}, largestContentfulPaintMs: {} };
          for (const category of categories) {
            const oldScore = Math.round(before.categories[category].score * 100);
            const newScore = Math.round(after.categories[category].score * 100);
            results.categories[category] = { before: oldScore, after: newScore, delta: newScore - oldScore };
          }
          const beforeLcp = Math.round(before.audits['largest-contentful-paint'].numericValue);
          const afterLcp = Math.round(after.audits['largest-contentful-paint'].numericValue);
          results.largestContentfulPaintMs = { before: beforeLcp, after: afterLcp, delta: afterLcp - beforeLcp, target: '<2500ms' };
          console.log('Lighthouse mobile before/after:', JSON.stringify(results, null, 2));
          fs.writeFileSync('artifacts/lighthouse/summary.json', JSON.stringify(results, null, 2));
          const targets = { performance: 90, accessibility: 95, seo: 95 };
          const failures = Object.entries(targets)
            .filter(([key, target]) => results.categories[key].after < target)
            .map(([key, target]) => key + ' target ' + target + ', got ' + results.categories[key].after);
          if (afterLcp >= 2500) failures.push('LCP target <2500ms, got ' + afterLcp + 'ms');
          if (failures.length) {
            console.error('Lighthouse targets not met:', failures.join('; '));
            process.exitCode = 1;
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcapulse-lighthouse-mobile-before-after
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 7

  browser-responsive:
    needs: syntax-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start the local PHP website
        shell: bash
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/orcapulse-php-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              echo "Local site ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orcapulse-php-server.log
          exit 1

      - name: Test all HTML pages at five viewport widths
        run: node scripts/smoke_site_responsive.cjs

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcapulse-design-audit-screenshots
          path: artifacts/design-audit/
          if-no-files-found: warn
          retention-days: 7

