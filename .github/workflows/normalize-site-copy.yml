name: Normalize reviewed OrcaPulse copy

on:
  push:
    branches:
      - fix/orcapulse-comprehensive-site-polish
      - fix/orcapulse-professional-layout
    paths:
      - scripts/normalize_site_copy.py
      - scripts/normalize_layout_assets.py
      - scripts/normalize_content_slots.py
      - assets/illustrations/editorial-*.svg
      - .github/workflows/normalize-site-copy.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply reviewed exact copy fixes
        run: python scripts/normalize_site_copy.py
      - name: Normalize redundant stylesheet includes
        run: python scripts/normalize_layout_assets.py
      - name: Remove empty content slots and add editorial artwork
        run: python scripts/normalize_content_slots.py
      - name: Commit normalized HTML pages
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No page copy updates were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "content: correct repeated copy across marketing pages"
          git push origin "$GITHUB_REF_NAME"
